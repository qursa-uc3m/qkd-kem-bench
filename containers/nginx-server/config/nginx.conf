user root;

worker_processes auto;

# Load environment variables to make them accessible to NGINX
env QKD_MASTER_KME_HOSTNAME;
env QKD_SLAVE_KME_HOSTNAME;
env QKD_MASTER_CA_CERT_PATH;
env QKD_SLAVE_CA_CERT_PATH;
env QKD_MASTER_CERT_PATH;
env QKD_MASTER_KEY_PATH;
env QKD_SLAVE_CERT_PATH;
env QKD_SLAVE_KEY_PATH;
env QKD_MASTER_SAE;
env QKD_SLAVE_SAE;
env OPENSSL_CONF;
env OPENSSL_MODULES;
env QKD_DEBUG;
env SSL_CERT_DIR;
env SSL_CERT_TYPE;
env DEFAULT_GROUPS;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Enhanced logging
    error_log logs/error.log debug;
    
    # Custom log format with SSL details
    log_format ssl_debug '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         '$ssl_protocol/$ssl_cipher';

    # HTTPS server
    server {
        listen 0.0.0.0:443 ssl http2;
        server_name localhost;
        
        # Standard access log
        access_log logs/access.log;
        
        # Additional SSL-specific logging
        access_log logs/ssl_debug.log ssl_debug;
        
        # Use environment variables for certificate paths
        ssl_certificate /opt/certs/${SSL_CERT_DIR}/${SSL_CERT_TYPE}_entity_cert.pem;
        ssl_certificate_key /opt/certs/${SSL_CERT_DIR}/${SSL_CERT_TYPE}_entity_key.pem;
        
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;
        ssl_protocols TLSv1.3;
        
        # Configure supported KEMs from environment variable
        ssl_ecdh_curve $DEFAULT_GROUPS;
        
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
        }
        
        location /info {
            alias /usr/share/nginx/html/;
            index server-info.html;
        }
        
        location /status {
            default_type application/json;
            return 200 '{ 
                "status": "running", 
                "hostname": "$hostname", 
                "time": "$time_iso8601",
                "ssl_cert_dir": "$SSL_CERT_DIR",
                "ssl_cert_type": "$SSL_CERT_TYPE",
                "qkd_backend": "$QKD_BACKEND",
                "qkd_debug": "$QKD_DEBUG",
                "qkd_master_kme_hostname": "$QKD_MASTER_KME_HOSTNAME",
                "qkd_slave_kme_hostname": "$QKD_SLAVE_KME_HOSTNAME",
                "qkd_master_sae": "$QKD_MASTER_SAE",
                "qkd_slave_sae": "$QKD_SLAVE_SAE",
                "qkd_master_ca_cert_path": "$QKD_MASTER_CA_CERT_PATH",
                "qkd_slave_ca_cert_path": "$QKD_SLAVE_CA_CERT_PATH",
                "qkd_master_cert_path": "$QKD_MASTER_CERT_PATH",
                "qkd_master_key_path": "$QKD_MASTER_KEY_PATH",
                "qkd_slave_cert_path": "$QKD_SLAVE_CERT_PATH",
                "qkd_slave_key_path": "$QKD_SLAVE_KEY_PATH",
                "openssl_conf": "$OPENSSL_CONF",
                "openssl_modules": "$OPENSSL_MODULES"    
            }';
        }

        # Simple environment variable display
        location /env {
            default_type text/plain;
            return 200 "Environment Variables in NGINX:\n\n
                        SSL_CERT_DIR: $SSL_CERT_DIR\n
                        SSL_CERT_TYPE: $SSL_CERT_TYPE\n
                        DEFAULT_GROUPS: $DEFAULT_GROUPS\n
                        QKD_BACKEND: $QKD_BACKEND\n
                        QKD_DEBUG: $QKD_DEBUG\n
                        QKD_MASTER_KME_HOSTNAME: $QKD_MASTER_KME_HOSTNAME\n
                        QKD_SLAVE_KME_HOSTNAME: $QKD_SLAVE_KME_HOSTNAME\n
                        QKD_MASTER_SAE: $QKD_MASTER_SAE\n
                        QKD_SLAVE_SAE: $QKD_SLAVE_SAE\n";
        }
    }
}